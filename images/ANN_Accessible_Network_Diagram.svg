<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">Feed-forward neural network for the XOR example</title>
<desc id="diagramDesc">The constant bias input x0 equals 1 and connects through weights w03 to hidden neuron 3, w04 to hidden neuron 4, and w05 to output neuron 5. Input x1 connects through w13 and w14 to hidden neurons 3 and 4. Input x2 connects through w23 and w24 to hidden neurons 3 and 4. Hidden neuron 3 connects through w35 to output neuron 5, and hidden neuron 4 connects through w45. All connections are directed from left to right. Every initial weight equals 0.1.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161616"/></marker></defs>
<rect width="920" height="440" fill="white"/>
<g font-family="Arial,sans-serif" fill="#161616" text-anchor="middle">
<text x="150" y="32" font-size="19" font-weight="bold">Input layer</text>
<text x="475" y="32" font-size="19" font-weight="bold">Hidden layer</text>
<text x="755" y="32" font-size="19" font-weight="bold">Output layer</text>
</g>
<g stroke="#171717" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M177 99 L444 139"/><path d="M177 102 L444 278"/><path d="M178 102 Q426 42 725 191"/>
<path d="M177 215 L444 143"/><path d="M177 219 L444 284"/>
<path d="M177 326 L444 145"/><path d="M177 330 L444 283"/>
<path d="M505 149 L725 203"/><path d="M505 279 L725 218"/>
</g>
<g fill="white" stroke="#111" stroke-width="2">
<circle cx="150" cy="92" r="29"/><circle cx="150" cy="213" r="29"/><circle cx="150" cy="330" r="29"/>
<circle cx="475" cy="145" r="30"/><circle cx="475" cy="279" r="30"/>
<circle cx="755" cy="210" r="31"/>
</g>
<g font-family="Arial,sans-serif" font-size="18" fill="#111" text-anchor="middle">
<text x="150" y="99">x₀</text><text x="150" y="220">x₁</text><text x="150" y="337">x₂</text>
<text x="475" y="152">3</text><text x="475" y="286">4</text><text x="755" y="217">5</text>
</g>
<text x="150" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">bias = 1</text>
<g font-family="Arial,sans-serif" font-size="16" fill="#111">
<text x="293" y="102">w₀₃</text><text x="315" y="203">w₀₄</text><text x="460" y="59">w₀₅</text>
<text x="294" y="170">w₁₃</text><text x="304" y="262">w₁₄</text>
<text x="259" y="284">w₂₃</text><text x="348" y="329">w₂₄</text>
<text x="604" y="159">w₃₅</text><text x="610" y="277">w₄₅</text>
</g>
<text x="460" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#111">All nine initial connection weights = 0.1</text>
</svg>